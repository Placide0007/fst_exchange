{% extends 'base.html' %}

{% load static %}

{% block title %}
    {{ post.title }}
{% endblock title %}

{% block content %}

<div class="px-25 py-10">

    <div class="max-w-3xl mx-auto">

        <div class="flex flex-col gap-5 border border-slate-300 rounded p-6 bg-white shadow-sm">

            <div class="flex justify-between items-center">

                <button class="text-xs bg-gray-300 p-1 text-gray-900">
                    Innovation
                </button>

                <span class="text-xs text-slate-500">
                    {{ post.created_at|date:"d M Y à H:i" }}
                </span>

            </div>

            <h1 class="text-3xl font-bold">
                {{ post.title }}
            </h1>

            <div class="border-t border-slate-200"></div>

            <p class="leading-7 text-sm">
                {{ post.content }}
            </p>

            <div class="flex justify-between items-center border-t border-slate-200 pt-4">

                <a href="{% url 'blog' %}"
                   class="text-sm border border-slate-300 px-3 py-2 rounded">
                    ← Retour
                </a>

                <div class="flex gap-4 items-center">

                    <form action="{% url 'react_post' post.id %}" method="POST">
                        {% csrf_token %}

                        <button type="submit" class="flex gap-1 items-center">

                            {% if request.user in post.reactions.all %}
                                <img src="{% static 'icons/like_full.svg' %}" class="w-5 h-5">
                            {% else %}
                                <img src="{% static 'icons/like.svg' %}" class="w-5 h-5">
                            {% endif %}

                            <span class="text-sm">
                                {{ post.reactions.count }}
                            </span>

                        </button>

                    </form>

                    <div class="flex gap-1 items-center">
                        <img src="{% static 'icons/comment.svg' %}" class="w-5 h-5">

                        <span class="text-sm">
                            {{ post.comments.count }}
                        </span>
                    </div>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock content %}
